<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta property="og:title" content="Lakers in 5 Meme Generator" />
  <meta property="og:description" content="Shannon Sharpe–style rhymes. Lakers in 🤚!" />
  <meta property="og:image" content="https://lakersin5.netlify.app/sharpe.jpeg" />
  <title>OpenAI Assistant UI</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .assistant-image {
      max-width: 400px;
      height: auto;
      border-radius: 8px;
      margin-bottom: 24px;
    }

    .input-wrapper {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }

    .text-input {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 999px;
      font-size: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      outline: none;
    }

    .circular-button {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background-color: #552583;
      color: white;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      transition: background-color 0.2s ease, opacity 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .circular-button.loading {
      opacity: 0.5;
      pointer-events: none;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid white;
      border-top: 3px solid transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .response {
      font-size: 18px;
      margin-top: 8px;
      text-align: center;
      max-width: 400px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="./sharpe.jpeg" alt="Assistant" class="assistant-image" />

    <div class="input-wrapper">
      <input type="text" class="text-input" placeholder="Enter one name or thing" maxlength="20"/>
      <button class="circular-button" id="send-button">🤚</button>
    </div>

    <div class="response" id="response-output"></div>
  </div>

  <script>
    const sendButton = document.getElementById('send-button');
    const responseOutput = document.getElementById('response-output');

    sendButton.addEventListener('click', async () => {
      const inputValue = document.querySelector('.text-input').value;
      if (!inputValue) return alert("Please enter something!");

      // UI: disable button and show spinner
      sendButton.classList.add("loading");
      sendButton.innerHTML = `<div class="spinner"></div>`;
      responseOutput.textContent = "";

      const systemPrompt = `
      You are a comedic meme creator in Shannon Sharpe’s “Lakers in 5” style.
      Study these actual examples for cadence, humor, and overall vibe:
      - Maple tree, Bud Dupree, JaVale McGee... Lakers in 🤚
      - Serge Ibaka, Chewbacca, Waka Flocka... Lakers in 🤚
      - OKC, KFC, UFC... Lakers in 🤚

      Make ONE line with exactly THREE items that all rhyme with the user’s word: {{word}}, ending with “... Lakers in 🤚”

      ### RULES:
      1. **All three** items must share the exact final sound with “{{word}}” (strict rhyme).
      2. **One** of the three items must be the user’s word “{{word}}” itself, spelled exactly.
      3. **No repeated or near-duplicate last names** (e.g. “Brown,” “Charlie Brown,” “Jaylen Brown” is invalid).
      4. **Order of preference** if multiple names exist:
         - **Professional athlete** (if it rhymes),
         - Else a **celebrity** (not random or unknown),
         - Else a **book/movie character**,
         - Else a **funny/obscure food**
      5. **No possessives** or apostrophes. No repeated or partial words.
      6. The line must end with exactly: ... Lakers in 🤚
      7. Be funny, slightly absurd, but always respect these rules.

      If any item fails these rules, your answer is invalid.
      Never break the single-line format.
      Never skip the user’s original word.
      Strictly match final syllables—no partial or near rhymes.

      `;

      const finalPrompt = systemPrompt.replaceAll('{{word}}', inputValue);
      console.log(finalPrompt);

      try {
        // 🔁 Call your Netlify serverless function instead of OpenAI directly
        const response = await fetch("/.netlify/functions/generate-meme", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            userInput: inputValue,
            systemPrompt: finalPrompt
          })
        });

        const data = await response.json();
        const reply = data.reply || "No response.";
        responseOutput.textContent = reply;
      } catch (err) {
        console.error(err);
        responseOutput.textContent = "Error contacting Netlify function.";
      } finally {
        // Restore button
        sendButton.classList.remove("loading");
        sendButton.textContent = "🤚";
      }
    });
  </script>
</body>
</html>
