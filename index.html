<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta property="og:title" content="Lakers in 5 Meme Generator" />
  <meta property="og:description" content="Shannon Sharpe–style rhymes. Lakers in 🤚!" />
  <meta property="og:image" content="https://lakersin5.netlify.app/sharpe.jpeg" />
  <title>OpenAI Assistant UI</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .assistant-image {
      max-width: 400px;
      height: auto;
      border-radius: 8px;
      margin-bottom: 24px;
    }

    .input-wrapper {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }

    .text-input {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 999px;
      font-size: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      outline: none;
    }

    .circular-button {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background-color: #552583;
      color: white;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      transition: background-color 0.2s ease, opacity 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .circular-button.loading {
      opacity: 0.5;
      pointer-events: none;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid white;
      border-top: 3px solid transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .response {
      font-size: 18px;
      margin-top: 8px;
      text-align: center;
      max-width: 400px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="./sharpe.jpeg" alt="Assistant" class="assistant-image" />

    <div class="input-wrapper">
      <input type="text" class="text-input" placeholder="Enter one name or thing" maxlength="20"/>
      <button class="circular-button" id="send-button">🤚</button>
    </div>

    <div class="response" id="response-output"></div>
  </div>

  <script>
    const sendButton = document.getElementById('send-button');
    const responseOutput = document.getElementById('response-output');

    sendButton.addEventListener('click', async () => {
      const inputValue = document.querySelector('.text-input').value;
      if (!inputValue) return alert("Please enter something!");

      // UI: disable button and show spinner
      sendButton.classList.add("loading");
      sendButton.innerHTML = `<div class="spinner"></div>`;
      responseOutput.textContent = "";

      const systemPrompt = `
      You are a comedic meme creator in Shannon Sharpe’s “Lakers in 5” style.
      Study these examples for cadence, humor, and style:
      - Maple tree, Bud Dupree, JaVale McGee... Lakers in 🤚
      - Serge Ibaka, Chewbacca, Waka Flocka... Lakers in 🤚
      - OKC, KFC, UFC... Lakers in 🤚

      Create ONE single line with exactly THREE items that strictly rhyme with {{word}}, ending with “… Lakers in 🤚” — no partial or near rhymes.

      RULES:
      1. Each item must be either:
         - a real professional athlete or well-known celebrity,
         - a recognized book/movie character,
         - OR a funny/obscure food (no random nouns phrases).
      2. If a pro athlete's name rhymes with {{word}}, prefer that first.
      3. One of the items must be {{word}} itself, spelled identically.
      4. No repeated or near-duplicate names or partial word reuse (e.g., “Brown” repeated).
      5. No random objects, no phrases like “downtown clown.” That is invalid.
      6. The line must end with: ... Lakers in 🤚
      7. Be funny or absurd, but never break these rules.

      If you break any rule (like using regular nouns like "clown," repeating "Brown," or partial rhymes), your answer is invalid.
      `;

      const finalPrompt = systemPrompt.replaceAll('{{word}}', inputValue);
      console.log(finalPrompt);

      try {
        // 🔁 Call your Netlify serverless function instead of OpenAI directly
        const response = await fetch("/.netlify/functions/generate-meme", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            userInput: inputValue,
            systemPrompt: finalPrompt
          })
        });

        const data = await response.json();
        const reply = data.reply || "No response.";
        responseOutput.textContent = reply;
      } catch (err) {
        console.error(err);
        responseOutput.textContent = "Error contacting Netlify function.";
      } finally {
        // Restore button
        sendButton.classList.remove("loading");
        sendButton.textContent = "🤚";
      }
    });
  </script>
</body>
</html>
